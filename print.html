<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TableQR – QR cards (demo)</title>
<link rel="stylesheet" href="assets/admin.css?v=1794507950">
<style>body{margin:0;padding:28px;background:#f0f0f1;font:13px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.tq-cards{grid-template-columns:repeat(4,1fr)}.tq-card{box-shadow:0 2px 10px rgba(0,0,0,.06)}</style>
</head>
<body>
<div class="tq-cards" id="cards"></div>
<script src="assets/qr.js?v=1794507950"></script>
<script>
var names = ["Table 1", "Table 2", "Table 3", "Table 4", "Table 5", "Terrace 1", "Terrace 2", "Bar"];
document.getElementById("cards").innerHTML = names.map(function (n, i) {
  return '<div class="tq-card" style="--tq-accent:#b3261e"><div class="tq-card-title">Bella Napoli</div>' +
    '<div class="tq-qr">' + TableQR.svg("https://bellanapoli.example/?tableqr=Dm" + i + "x7Kp2Lq9Ws4Rt8Yb", 2) + "</div>" +
    '<div class="tq-card-table">' + n + '</div><div class="tq-card-hint">Scan to see the menu and order</div></div>';
}).join("");
</script>
</body>
</html>
